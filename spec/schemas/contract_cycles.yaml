contract_cycles:
  monthly:
    description: Every calendar month
    months: [F, G, H, J, K, M, N, Q, U, V, X, Z]
  quarterly:
    description: Standard quarterly futures cycle
    months: [H, M, U, Z]
  b3_corn:

expiration_rules:
  nearest_wednesday_15:
    description: Wednesday closest to the 15th
    type: nearest_weekday_to_day
    weekday: wednesday
    day: 15
    last_trading_day: same_day
    roll_on_last_trading_day: false
  first_business_day:
    description: First trading day of the month; last trading session is the prior business day
    type: first_business_day
    last_trading_day: prior_business_day
    roll_on_last_trading_day: true
  third_friday:
    description: Third Friday of the month (common in US options)
    type: nth_weekday_of_month
    weekday: friday
    n: 3
    last_trading_day: same_day
    roll_on_last_trading_day: false
    tags:
      - options
      - US
  last_business_day:
    description: Last trading day of the month
    type: last_business_day
    last_trading_day: same_day
    roll_on_last_trading_day: false
  fifth_business_day:
    description: Fifth trading day of the month
    type: nth_business_day
    n: 5
  fixed_day_15:
    description: 15th calendar day of the month (next business day if holiday)
    type: fixed_day
    day: 15
  schedule:
    description: Dates vary per contract month; consult exchange maturity calendar
    type: schedule
  last_friday:
    description: Last Friday of the contract month
    type: last_weekday_of_month
    weekday: friday
  second_business_day_prior_to_month:
    description: Second business day prior to the contract month
    type: second_business_day_prior_to_month
  business_day_prior_to_16th_of_preceding_month:
    description: Business day prior to the 16th calendar day of the preceding month
    type: business_day_prior_to_day_of_preceding_month
    day: 16
  third_to_last_business_day:
    description: Third to last business day of the contract month
    type: nth_business_day_from_end
    n: 3
